# GitHub Pages 部署：web 发送端 + web 接收端
#
# 产物结构（单站点、相对 base，均可在子路径工作）：
#   /                    → 发送端（index.html，来自 apps/web/dist）
#   /receiver/           → 接收端（receiver.html 改名 index.html，来自 apps/web/dist-receiver）
#
# web 构建在 apps/web 下用 Rust/wasm-pack 编译单一 WASM 产物（wasm-pkg），
# 再构建 web 两端。

name: pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "core/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一 Pages 站点同一时刻只有一个部署在跑；新 push 会取消进行中的构建。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # actions 一律 pin commit SHA（与 windows.yml 同策略），注释保留版本号便于升级
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # 部署门禁：版本位点一致性（根 Cargo.toml 为唯一事实源）。此前本
      # workflow 是全仓唯一"零测试直接上线"的发布路径。
      - name: Version gate
        run: node scripts/version.mjs check

      # npm run wasm 需要 Rust + wasm32 目标 + wasm-pack
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable（与 windows.yml 同 pin）
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # 钉住版本：未锁版本时 crates.io 发新版会静默改变 WASM 产物/toolchain 行为
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Build WASM package (wasm-pkg)
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run wasm

      # FAST ZXing-C++ → WASM fast path for the web receiver's QR decode worker.
      # Produces apps/web/src/fastzxing/airferry_zxing.{js,wasm} (git-ignored);
      # prepare-wasm.cjs (web prebuild) copies them into public/. Pinned to the
      # same Emscripten version as core/zxing-decoder/link-wasm.sh. ZXing-C++ is
      # fetched at the pinned immutable commit (first run needs network).
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 3.1.64

      - name: Build FAST ZXing-C++ WASM
        run: ./scripts/build-fastzxing.sh

      - name: Build web sender (dist/)
        working-directory: apps/web
        run: npm run build

      - name: Build web receiver (dist-receiver/)
        working-directory: apps/web
        run: npm run build:receiver

      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/receiver
          # 发送端 → 站点根
          cp -r apps/web/dist/. _site/
          # 接收端 → /receiver/（receiver.html 作为该子路径的 index）
          cp -r apps/web/dist-receiver/. _site/receiver/
          mv _site/receiver/receiver.html _site/receiver/index.html
          # 发送端不使用 QR 解码器，但 Vite 会把整个 public/（含接收端的
          # airferry_zxing.*）拷进每个构建产物 —— 从站点根清掉，只留在 /receiver/
          # （favicon 属发送端自身资产，保留）。
          rm -f _site/airferry_zxing.js _site/airferry_zxing.wasm

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
