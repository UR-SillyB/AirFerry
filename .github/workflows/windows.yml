name: windows

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'apps/windows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'apps/windows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (for example v1.2.2)'
        required: true
        type: string

# Cancel only superseded runs of the same trigger/tag. A manual release build
# must not cancel the push quality gate that created the release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

# Least privilege by default for every job (mirrors ci.yml / pages.yml);
# windows-pack overrides this with the job-level contents: write it needs.
permissions:
  contents: read

jobs:
  # ── Job 1: Rust C ABI 层（跨平台，cargo test --features cffi）─────────────
  # 验证 cffi.rs 的位域打包、句柄生命周期、端到端恢复。在任何 OS 上跑都行，
  # 用 ubuntu 最快最省额度。对标 Android 的 cargo test -p transfer-engine。
  rust-cffi:
    name: Rust C ABI (cffi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cffi-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cffi-

      - name: cargo test --features cffi
        # tests/ 目录的 v1 集成测试已随 AF2 迁移删除；行为覆盖由
        # core/af2/tests 边界矩阵 + cffi.rs 内联单测承接。
        run: cargo test -p transfer-engine --features cffi

      - name: cargo build cdylib smoke (验证 DLL 目标可产出)
        run: cargo build -p transfer-engine --features cffi --release

  # ── Job 2: C# 协议层单元测试（跨平台）────────────────────────────────────
  # 只测纯 C# 逻辑（含 native packed 结果的托管解析），不实际加载 P/Invoke DLL，
  # net8.0 TFM 可在 ubuntu 上跑。
  csharp-tests:
    name: C# protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test (AirFerry.Windows.Tests)
        run: |
          cd apps/windows
          dotnet test AirFerry.Windows.Tests/AirFerry.Windows.Tests.csproj -c Release --logger "console;verbosity=normal"

  # ── Job 3: Windows 端完整构建（仅 Windows runner）─────────────────────────
  # WPF (net8.0-windows TFM) 只能在 Windows 上构建。对标 build-windows.ps1：
  # ① cargo build --features cffi → transfer_engine.dll
  # ② CMake → airferry_zxing.dll（与 Android 共用解码核心）
  # ③ dotnet build → AirFerry.exe（含 runtime/ DLL 拷贝）
  # 不在此 job 跑 dotnet test（协议层测试已在 csharp-tests job 跑过，避免重复）。
  windows-build:
    name: Windows build (WPF + native DLLs)
    # CMake explicitly targets the VS 2022 generator; pin the matching runner
    # instead of following windows-latest to images that may omit VS 2022.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cffi-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cffi-

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/windows/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build Rust C ABI DLL (--features cffi)
        run: cargo build -p transfer-engine --features cffi --release

      - name: Copy DLL to C# runtime/
        shell: pwsh
        run: |
          $dll = "target/release/transfer_engine.dll"
          if (-not (Test-Path $dll)) { throw "Rust DLL not found: $dll" }
          New-Item -ItemType Directory -Force -Path apps/windows/AirFerry.Windows/runtime | Out-Null
          Copy-Item $dll apps/windows/AirFerry.Windows/runtime/transfer_engine.dll -Force
          Write-Host "Copied $dll -> runtime/"

      - name: Build shared ZXing-C++ decoder
        shell: pwsh
        run: |
          cmake -S apps/windows/native -B apps/windows/native/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ CMake configure failed" }
          cmake --build apps/windows/native/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ build failed" }
          ctest --test-dir apps/windows/native/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ tests failed" }
          $dll = Get-ChildItem apps/windows/native/build -Recurse -File -Filter airferry_zxing.dll |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $dll) { throw "airferry_zxing.dll not found" }
          Copy-Item $dll.FullName apps/windows/AirFerry.Windows/runtime/airferry_zxing.dll -Force

      - name: dotnet restore
        run: dotnet restore apps/windows/AirFerry.sln

      - name: dotnet build (WPF Release)
        run: dotnet build apps/windows/AirFerry.Windows/AirFerry.Windows.csproj -c Release --no-restore

      - name: dotnet publish (single-file, win-x64, self-contained=false)
        run: >-
          dotnet publish apps/windows/AirFerry.Windows/AirFerry.Windows.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true --self-contained false

      - name: Pack zip
        shell: pwsh
        run: |
          $BinRoot = "apps/windows/AirFerry.Windows/bin"
          $publishDirs = Get-ChildItem -Path $BinRoot -Recurse -Directory -Filter "publish" -ErrorAction SilentlyContinue
          if ($publishDirs.Count -eq 0) {
            throw "未找到 publish 目录"
          }
          $PublishDir = $publishDirs[-1].FullName
          foreach ($required in @("transfer_engine.dll", "airferry_zxing.dll")) {
            $runtimeDll = Join-Path "apps/windows/AirFerry.Windows/runtime" $required
            Copy-Item $runtimeDll (Join-Path $PublishDir $required) -Force
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ZipName = "dist/airferry-receiver-windows-x64.zip"
          if (Test-Path $ZipName) { Remove-Item $ZipName -Force }
          Compress-Archive -Path "$PublishDir/*" -DestinationPath $ZipName
          Write-Host "Windows 接收端 -> $ZipName"

      - name: Upload Windows Receiver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airferry-windows-x64
          path: dist/airferry-receiver-windows-x64.zip
          if-no-files-found: error

  # ── Job 4: Windows 发布打包 + 上传到 GitHub release ──────────────────────
  # 镜像 build-windows.ps1 -Pack：
  # ① cargo build --features cffi → transfer_engine.dll → runtime/
  # ② CMake → airferry_zxing.dll → runtime/
  # ③ dotnet publish -r win-x64 single-file self-contained=false → publish/
  # ④ Compress publish/ → airferry-receiver-windows-x64-v${VER}.zip
  # ⑤ gh release upload 到 v${VER}（tag 已存在，--clobber 覆盖同名 asset）
  # 只在 workflow_dispatch + 打包后手动触发上传（避免每次 push 都发 release）。
  # 版本号从手动输入的现有 release_tag 派生，并与 checkout commit 及
  # web package/manifest 核对；workflow 内不保存另一份版本副本。
  windows-pack:
    name: Windows receiver publish + upload to release
    needs: [rust-cffi, csharp-tests, windows-build]
    runs-on: windows-2022
    timeout-minutes: 45
    # 仅在手动触发时跑（不污染 push/PR）；确保质量门（前三个 job）通过。
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # gh release upload 需要
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release tag, commit and version identity
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $ver = $env:RELEASE_TAG.Substring(1)
          # 扩展 manifest 由 apps/web/scripts/build-ext.cjs 构建时从 package.json
          # 版本生成（package.json 本身无 manifest 字段），这里只校验版本事实源。
          $package = Get-Content apps/web/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $ver) {
            throw "Tag version $ver does not match apps/web/package.json version $($package.version)"
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out commit $headCommit does not match tag $env:RELEASE_TAG ($tagCommit)"
          }
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cffi-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cffi-

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/windows/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build Rust C ABI DLL (--features cffi)
        run: cargo build -p transfer-engine --features cffi --release

      - name: Copy DLL to C# runtime/
        shell: pwsh
        run: |
          $dll = "target/release/transfer_engine.dll"
          if (-not (Test-Path $dll)) { throw "Rust DLL not found: $dll" }
          New-Item -ItemType Directory -Force -Path apps/windows/AirFerry.Windows/runtime | Out-Null
          Copy-Item $dll apps/windows/AirFerry.Windows/runtime/transfer_engine.dll -Force
          Write-Host "Copied $dll -> runtime/"

      - name: Build shared ZXing-C++ decoder
        shell: pwsh
        run: |
          cmake -S apps/windows/native -B apps/windows/native/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ CMake configure failed" }
          cmake --build apps/windows/native/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ build failed" }
          ctest --test-dir apps/windows/native/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ZXing-C++ tests failed" }
          $dll = Get-ChildItem apps/windows/native/build -Recurse -File -Filter airferry_zxing.dll |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $dll) { throw "airferry_zxing.dll not found" }
          Copy-Item $dll.FullName apps/windows/AirFerry.Windows/runtime/airferry_zxing.dll -Force

      - name: dotnet restore
        run: dotnet restore apps/windows/AirFerry.sln

      - name: dotnet publish (single-file, win-x64, self-contained=false)
        # 镜像 build-windows.ps1 -Pack：单文件、框架依赖（目标机须装 .NET 8 运行时）
        run: >-
          dotnet publish apps/windows/AirFerry.Windows/AirFerry.Windows.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true --self-contained false

      - name: Pack zip
        shell: pwsh
        run: |
          # dotnet publish 把单文件产物写到 bin/$(Platform)/$(Configuration)/$(TFM)/$(RID)/publish/。
          # RID 段（win-x64）是否出现取决于 csproj 的 Platform/附带 RID，故不硬编码路径，
          # 而是在 bin 树里递归找 publish 目录（应恰有一个）。
          $BinRoot = "apps/windows/AirFerry.Windows/bin"
          $publishDirs = Get-ChildItem -Path $BinRoot -Recurse -Directory -Filter "publish" -ErrorAction SilentlyContinue
          if ($publishDirs.Count -eq 0) {
            throw "未找到 publish 目录（在 $BinRoot 下递归查找）——dotnet publish 是否真的产出了单文件？"
          }
          if ($publishDirs.Count -gt 1) {
            # 多个 publish 目录时挑最深/最新的那个，并打印警告以便日志核对。
            Write-Host "WARN: 找到 $($publishDirs.Count) 个 publish 目录，取最后一个："
            $publishDirs | ForEach-Object { Write-Host "  - $($_.FullName)" }
          }
          $PublishDir = $publishDirs[-1].FullName
          Write-Host "=== publish 目录: $PublishDir ==="
          foreach ($required in @("transfer_engine.dll", "airferry_zxing.dll")) {
            $runtimeDll = Join-Path "apps/windows/AirFerry.Windows/runtime" $required
            if (-not (Test-Path $runtimeDll)) {
              throw "runtime native dependency missing before packaging: $required"
            }
            # Keep packaging independent of SDK item-glob details and ensure
            # P/Invoke dependencies sit beside the single-file executable.
            Copy-Item $runtimeDll (Join-Path $PublishDir $required) -Force
            if (-not (Test-Path (Join-Path $PublishDir $required))) {
              throw "publish output missing native dependency: $required"
            }
          }
          # 列出产物清单（应含 AirFerry.exe + transfer_engine.dll +
          # airferry_zxing.dll + OpenCV native DLLs）
          Write-Host "=== publish 内容 ==="
          Get-ChildItem $PublishDir | Select-Object Name, Length | Format-Table -AutoSize
          $ZipName = "airferry-receiver-windows-x64-v${env:VER}.zip"
          if (Test-Path $ZipName) { Remove-Item $ZipName -Force }
          Compress-Archive -Path "$PublishDir/*" -DestinationPath $ZipName
          Write-Host "Windows 接收端 -> $ZipName ($((Get-Item $ZipName).Length) bytes)"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ZipName = "airferry-receiver-windows-x64-v${env:VER}.zip"
          $Tag = "v${env:VER}"
          gh release view $Tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "Release $Tag does not exist; refusing to upload to an implicit tag"
          }
          # --clobber：覆盖同名 asset（覆盖式发布）。asset 不设 label（见 AGENTS.md §2.8）。
          gh release upload $Tag "$ZipName" --clobber
          Write-Host "已上传 $ZipName 到 release $Tag"
