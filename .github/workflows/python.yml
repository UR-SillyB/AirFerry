name: python

on:
  push:
    branches: [main]
    paths:
      - 'apps/python/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'apps/python/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
            interpreter: python3.10
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
            interpreter: python
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1 (peeled commit)
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --manifest-path apps/python/Cargo.toml --release --locked --out dist/python -i ${{ matrix.platform.interpreter }}

      - name: Install the built wheel and test dependencies
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('dist/python').glob('*.whl'));
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[test]'], check=True)"

      # Dependencies are installed before the tests deny network operations.
      # This includes real MP4/QR/Rust receive interop and test_offline_generation.
      - name: Test installed package
        run: python -m pytest apps/python/tests -m "not slow"

      - name: Save wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.platform.name }}
          path: dist/python/*.whl
          if-no-files-found: error

  sdist:
    name: Rebuild from source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install packaging tools
        run: python -m pip install maturin==1.15.0 build twine

      - name: Build sdist
        run: python -m build --sdist apps/python --outdir dist/python

      - name: Check package metadata
        run: python -m twine check dist/python/*

      - name: Check source archive contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile

          archive = next(pathlib.Path("dist/python").glob("*.tar.gz"))
          with tarfile.open(archive) as source:
              names = source.getnames()
          root = names[0].split("/")[0]
          unwanted = {".venv", "__pycache__", "dist", "target", "node_modules"}
          suffixes = (".pyc", ".pyo", ".whl", ".pyd", ".so", ".dll", ".exe", ".pem", ".key", ".keystore")
          assert not [name for name in names if unwanted.intersection(name.split("/")) or name.endswith(suffixes)]
          vendor = pathlib.Path("core/qr-protocol/vendor/fast_qr")
          expected = {f"{root}/{path.as_posix()}" for path in vendor.rglob("*") if path.is_file()}
          assert expected <= set(names), sorted(expected - set(names))
          assert f"{root}/core/qr-protocol/vendor/fast_qr/Cargo.toml" in names
          print(f"Verified {len(names)} archive entries, including {len(expected)} vendored QR files")
          PY

      # pip unpacks the archive outside this checkout: missing path dependencies,
      # the workspace manifest, or the vendored fast_qr patch must fail here.
      - name: Build wheel from sdist
        run: python -m pip wheel --no-deps --wheel-dir dist/sdist-check dist/python/*.tar.gz

      - name: Verify WASM workspace isolation
        run: node --test apps/sender/scripts/test-build-wasm.cjs

      - name: Save source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: dist/python/*.tar.gz
          if-no-files-found: error
