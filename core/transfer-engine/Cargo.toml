[package]
name = "transfer-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transfer orchestration, progress, resume, and WASM/JNI bindings for AirFerry."

# Emit both a rlib (for in-tree dependents / integration tests) and a cdylib
# (for wasm-bindgen on the browser side and for cargo-ndk →
# libtransfer_engine.so on Android). Kotlin loads "transfer_engine".
[lib]
name = "transfer_engine"
crate-type = ["rlib", "cdylib"]

[dependencies]
raptorq-core.workspace = true
qr-protocol.workspace = true
af2.workspace = true

[dev-dependencies]
# ReceiverSession §11 eviction test crafts a hostile chunk object (encoder side).
raptorq = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pin the wasm-bindgen family to versions BEFORE 0.2.93 / js-sys 0.3.70.
# wasm-bindgen 0.2.93 enabled the reference-types proposal (`externref` value
# type) by default in its generated `.wasm`; that type only ships in Chrome 96+,
# so a loose `"0.2"` / `"0.3"` requirement (resolving to 0.2.125 / 0.3.102)
# emits a module that Chrome 87/88 rejects at
# `WebAssembly.instantiateStreaming()` with
#   CompileError: invalid value type 'externref'
# Chrome 87 is the baseline for MV3 extension_pages, so the sender must stay
# loadable there. Keep the two pinned together: js-sys 0.3.69 is the release
# that accompanied wasm-bindgen 0.2.92. Do NOT loosen these to `"0.2"`/`"0.3"`
# — that would let the default lockfile drift to 0.2.93+ and break the MV2
# build.
#
# Single-track note: the former dual-track (build-wasm.cjs temporarily bumped
# these to 0.2.125 + `+simd128`/externref for the MV3 `wasm-pkg-simd` variant)
# was removed — measured, SIMD/externref gave no speedup on the scalar
# raptorq/fast_qr hot path while doubling the build matrix. The ONE scalar
# 0.2.92 artifact below loads from Chrome 87 to current. FAST ZXing's
# `-msimd128` is receiver-only and built separately (build-fastzxing.sh).
js-sys = "=0.3.69"
wasm-bindgen = { version = "=0.2.92", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[features]
default = []
# The wasm bindings return hand-rolled JSON strings (escape_json_str), so this
# crate needs no serde machinery.
wasm = ["dep:wasm-bindgen"]
# JNI bindings for Android. `pub mod jni` is additionally gated on
# target_os = "android" in lib.rs.
jni = ["dep:jni"]
# Plain C ABI export (`#[no_mangle] extern "C"`) for the Windows client's
# P/Invoke. An empty feature: it only switches the `cffi` module in,
# adds no new dependency, and relies on the already-declared `cdylib` crate-type
# to emit `transfer_engine.dll` on Windows targets.
cffi = []
