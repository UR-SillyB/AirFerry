[package]
name = "qr-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "QR frame format, chunking, compression and session logic for AirFerry."

[dependencies]
raptorq-core.workspace = true
crc32fast.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
# Optimized QR generator (~7-9× faster than the `qrcode` crate on the
# per-frame Reed-Solomon path); compiles to wasm32 for the browser sender.
# Vendored with fixed-mask fast path (see [patch.crates-io] in workspace root).
fast_qr = { version = "0.13", default-features = false }
# zstd is only available on native/android targets; on wasm32 the C library
# does not compile, so compression is performed on the JS side instead.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
# XZ/LZMA2 — extreme compression (native/Android only). The C library does not
# compile on wasm32, and the browser compresses in JS anyway, so it stays gated.
xz2 = "0.1"

[target.wasm32-unknown-unknown.dependencies]
lzma-rs = "0.3"
ruzstd = "0.7"
zrip = { version = "0.8", default-features = false, features = ["std", "frame"] }
lzma-rust2 = { version = "0.19", default-features = false, features = ["std", "encoder", "xz"] }

[dev-dependencies]
# Host tests cross-verify the pure-Rust wasm32 codecs against native decoders
zrip = { version = "0.8", default-features = false, features = ["std", "frame"] }
lzma-rust2 = { version = "0.19", default-features = false, features = ["std", "encoder", "xz"] }
# ...and the wasm32 DECODER stack against native-produced frames: ruzstd /
# lzma-rs only build as wasm32 target deps normally, so mirror them here to
# give the web receiver's decode path real CI coverage on native test runs.
ruzstd = "0.7"
lzma-rs = "0.3"

[features]
default = []
serde = ["dep:serde", "raptorq-core/serde"]
